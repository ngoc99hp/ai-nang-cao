name: aai
services:
  lab:
    build: { context: ., dockerfile: docker/Dockerfile }
    image: aai-lab:1
    container_name: aai-lab
    command: sleep infinity
    init: true
    network_mode: none
    working_dir: /home/aai/aai_misconception
    volumes:
      - .:/home/aai/aai_misconception
      - ./data/raw:/home/aai/aai_misconception/data/raw:ro
    tmpfs: ["/tmp:size=512m"]
    cpus: 1.5
    cpu_shares: 256
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  # Giao diện demo (Streamlit). Không chạy code sinh viên: chỉ đọc results/, demo/ và ghi job vào work/queue;
  # worker trong 'sandbox' (không mạng) mới compile/chạy. Cổng chỉ mở trên 127.0.0.1 → truy cập qua SSH tunnel.
  ui:
    build: { context: ., dockerfile: docker/Dockerfile.ui }
    image: aai-ui:1
    container_name: aai-ui
    command: streamlit run /app/app.py
    init: true
    ports: ["127.0.0.1:8501:8501"]
    working_dir: /app
    volumes:
      - ./ui:/app:ro
      - ./results:/data/results:ro
      - ./demo:/data/demo:ro
      - ./work/queue:/data/queue
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  # Sandbox chấm bài nộp từ giao diện demo (code của người lạ). Tách khỏi 'lab': root fs chỉ đọc, chỉ mount
  # đúng phần cần ở chế độ :ro; ghi được duy nhất hàng đợi + vùng tạm (tmpfs) để compile/chạy.
  sandbox:
    image: aai-lab:1
    container_name: aai-sandbox
    command: python -W ignore scripts/demo_worker.py
    init: true
    network_mode: none
    working_dir: /home/aai/aai_misconception
    environment: [PYTHONUNBUFFERED=1]
    volumes:
      - ./src:/home/aai/aai_misconception/src:ro
      - ./scripts:/home/aai/aai_misconception/scripts:ro
      - ./bench:/home/aai/aai_misconception/bench:ro
      - ./data/processed/demo:/home/aai/aai_misconception/data/processed/demo:ro
      - ./data/raw/introclass/digits/tests:/home/aai/aai_misconception/data/raw/introclass/digits/tests:ro
      - ./data/raw/introclass/grade/tests:/home/aai/aai_misconception/data/raw/introclass/grade/tests:ro
      - ./data/raw/introclass/median/tests:/home/aai/aai_misconception/data/raw/introclass/median/tests:ro
      - ./data/raw/introclass/smallest/tests:/home/aai/aai_misconception/data/raw/introclass/smallest/tests:ro
      - ./work/queue:/home/aai/aai_misconception/work/queue
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /home/aai/aai_misconception/work/demo_jobs:exec,mode=1777,size=256m
    cpus: 1.0
    cpu_shares: 256
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: on-failure
